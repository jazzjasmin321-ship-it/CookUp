
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CookUp - Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #fff7f0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .brand {
            text-align: center;
            color: #ff7a00;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .title {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff7a00;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #ff7a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e65c00;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="brand">
        CookUp
    </div>


    <div class="title">
        Admin Login
    </div>


    <form id="loginForm">


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter admin password"
            required
        >


        <button type="submit">
            Login
        </button>


    </form>


    <div id="message"></div>


</div>


<script>


document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value;


        const password =
            document
                .getElementById("password")
                .value;


        const message =
            document.getElementById("message");


        message.className = "";
        message.textContent = "Logging in...";


        try {

            const response =
                await fetch("/api/admin/login", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });


            if (response.ok) {

                message.className =
                    "success";

                message.textContent =
                    "Login successful!";


                setTimeout(function() {

                    window.location.href =
                        "/admin/dashboard";

                }, 500);

            }

            else {

                const error =
                    await response.text();

                message.className =
                    "error";

                message.textContent =
                    error ||
                    "Invalid admin email or password.";

            }

        }

        catch (error) {

            console.error(error);

            message.className =
                "error";

            message.textContent =
                "Unable to connect to server.";

        }

    });


</script>


</body>

</html>
